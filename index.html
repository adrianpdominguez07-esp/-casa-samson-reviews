<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Casa Samson · Reseñas</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f7;
      color: #111;
    }
    main {
      width: min(90%, 420px);
      text-align: center;
      background: white;
      padding: 32px 24px;
      border-radius: 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 10px; font-size: 28px; }
    p { color: #555; line-height: 1.5; margin-bottom: 24px; }
    a {
      display: block;
      text-decoration: none;
      padding: 15px 18px;
      margin: 12px 0;
      border-radius: 12px;
      font-weight: 700;
    }
    .review { background: #111; color: white; }
    .maps { background: #eee; color: #111; }
    small { color: #777; }
  </style>
</head>
<body>
  <main>
    <h1>⭐ Casa Samson</h1>
    <p>¿Has disfrutado de tu visita? Nos ayudaría mucho que dejaras una reseña en Google.</p>

    <a class="review"
       href="https://search.google.com/local/writereview?placeid=ChIJxRVNFABZYA0R6H2YtxLNIZs">
      ⭐ Dejar una reseña en Google
    </a>

    <a class="maps"
       href="https://www.google.com/maps/search/?api=1&query=Casa+Samson%2C+Riba-roja+de+T%C3%BAria&query_place_id=ChIJxRVNFABZYA0R6H2YtxLNIZs">
      📍 Abrir Casa Samson en Google Maps
    </a>

    <small>Si el primer botón no se abre correctamente, utiliza Google Maps.</small>
  </main>
</body>
</html>
